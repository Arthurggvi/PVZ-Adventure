  <path d="M22 3.4c-2.7 2-4.9 5-5.8 8.1-.7 2.2-.7 4-.6 5.9l-2.1.7c-.2-3.5.6-6.4 2-8.9 1.5-2.6 3.6-4.6 6.5-5.8Z"
        fill="#42582f" opacity=".34"/>
  <path d="M20.3 4.8C16.9 7.6 15 11.3 14.9 15.7" fill="none" stroke="#d1d493" stroke-width=".72" opacity=".67" stroke-linecap="round"/>
  <path d="M43.8 6.8c2.7 2.2 3.8 5 3.6 8.6l4.9-.4c-.6-3.3-2.8-6.1-8.5-8.2Z" fill="#263e2b" opacity=".47"/>

  <!-- 围边压在帽冠下方，留出偏左的布面高光和针脚。 -->
