  <path d="M8.1 22.4c9.6.9 20.2-3.1 30.9-3.1 4.4 0 7.3.7 10.2.4" fill="none" stroke="#2a402c" stroke-width="1" stroke-linecap="round" opacity=".86"/>

  <!-- 弧形帽檐的背面与上表面各有独立明暗。 -->
  <path d="M31.4 16.7c9.6-3.9 22.6-4.1 28.4.1 2.1 2.7-1.3 6.3-7.8 7.7-4.8 1-9.4-2.1-15.5-2.7l-7.4.3Z"
