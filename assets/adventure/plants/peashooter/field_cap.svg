  <path d="M31.4 16.6c9.7-3.7 21.4-3.8 27.5.1 1.4 1.8-1.2 4.4-6.4 5.5-4.4 1-8.9-1.7-14.5-2.4l-7.5.5Z"
        fill="url(#bill)"/>
  <path d="M35.9 17.1c7.6-2.6 15.3-2.5 21.3-.4" fill="none" stroke="#d0d7a0" stroke-width="1.05" stroke-linecap="round" opacity=".61"/>
  <path d="M38.3 18.8c5.9.3 10 3.1 14.2 2 2-.5 3.7-1.1 5-2.2" fill="none" stroke="#afbd83" stroke-width=".74" stroke-linecap="round" opacity=".63"/>

  <!-- 小铜徽下沿为暗面，边缘受光处保留窄高光。 -->
  <path d="m34.7 6.8 7.3.4.5 4.3-3.8 2.5-4.5-1.8Z" fill="#394930" opacity=".83"/>
  <path d="m34.6 6.3 7 .6.3 3.7-3.3 2.4-4.6-1.8Z" fill="url(#brass)" stroke="#485033" stroke-width=".88" stroke-linejoin="round"/>
  <path d="m36.2 8.1 2.4 1.7 1.8-1.5" fill="none" stroke="#795f3b" stroke-width=".8" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="m35.2 7.2 3.6.25" fill="none" stroke="#f4e0a9" stroke-width=".56" stroke-linecap="round" opacity=".83"/>
</svg>
