<svg xmlns="http://www.w3.org/2000/svg" width="62" height="31" viewBox="0 0 62 31">
  <defs>
    <linearGradient id="cloth" gradientUnits="userSpaceOnUse" x1="11" y1="1" x2="40" y2="25">
      <stop stop-color="#c7ce8b"/>
      <stop offset=".25" stop-color="#a5b66b"/>
      <stop offset=".57" stop-color="#778d4d"/>
      <stop offset=".82" stop-color="#455e37"/>
      <stop offset="1" stop-color="#283e29"/>
    </linearGradient>
    <linearGradient id="cloth-light" gradientUnits="userSpaceOnUse" x1="17" y1="4" x2="32" y2="14">
      <stop stop-color="#e0dfaa" stop-opacity=".8"/>
      <stop offset="1" stop-color="#c6cf8b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="band" gradientUnits="userSpaceOnUse" x1="6" y1="15" x2="48" y2="25">
      <stop stop-color="#829858"/>
      <stop offset=".48" stop-color="#596f43"/>
      <stop offset="1" stop-color="#304530"/>
    </linearGradient>
    <linearGradient id="bill" gradientUnits="userSpaceOnUse" x1="38" y1="13" x2="54" y2="23">
      <stop stop-color="#a4b775"/>
      <stop offset=".34" stop-color="#849c62"/>
      <stop offset=".7" stop-color="#536e48"/>
      <stop offset="1" stop-color="#344e37"/>
    </linearGradient>
    <linearGradient id="brass" gradientUnits="userSpaceOnUse" x1="34" y1="6" x2="42" y2="15">
      <stop stop-color="#e7d49a"/>
      <stop offset=".42" stop-color="#c5aa6c"/>
      <stop offset="1" stop-color="#8d7246"/>
    </linearGradient>
    <linearGradient id="contact" gradientUnits="userSpaceOnUse" x1="30" y1="19" x2="31" y2="30">
      <stop stop-color="#152619" stop-opacity=".46"/>
      <stop offset=".62" stop-color="#152619" stop-opacity=".26"/>
      <stop offset="1" stop-color="#152619" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 帽围贴着头部的软阴影。 -->
  <path d="M9.4 20.9c13.4-.1 22.6-4.9 39.6-1.7l6.4 3.8c-9.8-1.9-16.1 2.2-24.6 3.6-7.1 1.2-14.7 3.6-21 1.8-.8-2.3-.7-4.8-.4-7.5Z"
        fill="url(#contact)"/>

  <!-- 帽身外轮廓、贴额下缘和背光侧面。 -->
  <path d="M4.3 19.6C5.5 16.9 5.8 11.9 8.6 8.1 12.1 3.2 18.8 1.7 26.2 1.8c8.5.1 16.1 2 20.8 4.7 3.3 1.9 5 4.7 5.7 7.7l-.6 6.8c-3 2.9-7.4 1.2-12.9 1.1-11.6-.3-22.2 3.6-30.9 3.1-3.3-.2-4.9-2.4-4-5.6Z"
