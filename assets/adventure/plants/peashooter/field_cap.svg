  <path d="M9.4 9.2c3.9-5 12.2-6.9 21.5-5.8 5.2.6 9.5 1.7 13.5 3.6-6.3-1.1-10.8-2.2-17-2.1-7.3.1-13.1 2.3-17.9 7.9Z"
